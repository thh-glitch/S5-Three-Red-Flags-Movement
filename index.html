        let currentStageIndex = 0;

        function renderStage(index) {
            if (index >= stages.length) return;
            const container = document.getElementById('game-container');
            const stage = stages[index];

            let html = '';
            if (stage.chapter) {
                html += `<div class="col-span-full mt-12 mb-6 animate__animated animate__fadeIn"><div class="flex items-center justify-center space-x-4"><div class="h-1 flex-1 bg-red-800"></div><h2 class="text-3xl font-black text-red-900 px-4">${stage.chapter}</h2><div class="h-1 flex-1 bg-red-800"></div></div></div>`;
            }

            // Render Documents
            let docsHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">';
            stage.documents.forEach((doc, i) => {
                let colSpan = (stage.documents.length % 2 !== 0 && i === stage.documents.length - 1) ? 'md:col-span-2' : '';
                let extClass = doc.type === 'doc-rumor' ? 'doc-rumor' : doc.type === 'doc-quote' ? 'doc-quote' : doc.type === 'doc-news' ? 'doc-news' : 'doc-report';
                docsHTML += `<div class="p-4 rounded shadow-sm ${extClass} ${colSpan}">${doc.type === 'doc-report' ? '<div class="stamp">機密</div>' : ''}<h4 class="font-bold mb-2 text-gray-800 text-lg border-b border-gray-300 pb-1">${doc.title}</h4><p class="text-gray-700 leading-relaxed">${doc.content}</p></div>`;
            });
            docsHTML += '</div>';

            // Render Questions Chain (initially only show Q0)
            let questionsHTML = `<div class="space-y-6" id="q-container-${index}">`;
            stage.questions.forEach((qObj, qIndex) => {
                let hiddenClass = qIndex === 0 ? '' : 'hidden';
                questionsHTML += `
                    <div id="q-block-${index}-${qIndex}" class="q-block bg-white/80 p-5 rounded border-2 border-red-200 shadow-sm ${hiddenClass} animate__animated animate__fadeInDown">
                        <p class="text-xl font-bold text-party-red mb-4 leading-relaxed"><i class="fa-solid fa-link mr-2"></i> 追問 ${qIndex + 1}/${stage.questions.length}：${qObj.q}</p>
                        <div class="space-y-3" id="options-${index}-${qIndex}">
                            ${qObj.options.map((opt, optIndex) => `
                                <button onclick="handleChainSelection(${index}, ${qIndex}, ${optIndex}, ${opt.isCorrect})" class="btn-option w-full text-left p-4 rounded bg-white border-2 border-gray-400 text-lg font-bold text-gray-800 flex items-start hover:bg-gray-50 transition">
                                    <span class="mr-3 mt-1 inline-block bg-gray-200 px-2 py-0.5 rounded text-sm">${String.fromCharCode(65 + optIndex)}</span><span>${opt.text}</span>
                                </button>
                            `).join('')}
                        </div>
                        <div id="feedback-${index}-${qIndex}" class="hidden mt-4 p-4 rounded-lg font-bold text-lg animate__animated animate__fadeIn"></div>
                    </div>
                `;
            });
            questionsHTML += `</div>`;

            html += `
                <div id="stage-${index}" class="bg-[#f4ebd8] rounded-xl p-6 md:p-8 retro-shadow border-2 border-[#b5a38c] animate__animated animate__fadeInUp relative">
                    <div class="absolute top-0 left-0 w-full h-2 bg-party-red rounded-t-xl"></div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-6 flex items-center"><span class="bg-gray-900 text-white px-3 py-1 rounded mr-3 text-lg">${index + 1}</span>${stage.title}</h3>
                    
                    ${docsHTML}
                    
                    <div class="bg-white/60 p-5 rounded border border-[#b5a38c] mb-6">
                        <p class="text-gray-800 text-lg font-bold leading-relaxed"><i class="fa-solid fa-user-tie text-gray-600 mr-2"></i> 【幹部處境】${stage.context}</p>
                    </div>
                    
                    <!-- 因果追問區 -->
                    ${questionsHTML}
                    
                    <div id="supplement-${index}" class="hidden mt-6 p-5 bg-yellow-50 border-l-8 border-yellow-400 text-gray-800 rounded animate__animated animate__fadeIn shadow-inner">
                        <div class="font-black text-yellow-800 mb-2 text-lg"><i class="fa-solid fa-lightbulb"></i> 歷史真相解析：</div>
                        <div class="leading-relaxed font-medium">${stage.supplement}</div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            scrollToEl(`stage-${index}`);
        }

        function handleChainSelection(stageIndex, qIndex, optionIndex, isCorrect) {
            const stage = stages[stageIndex];
            const qObj = stage.questions[qIndex];
            const btns = document.querySelectorAll(`#options-${stageIndex}-${qIndex} button`);
            const fb = document.getElementById(`feedback-${stageIndex}-${qIndex}`);
            
            btns.forEach((btn, idx) => {
                btn.disabled = true;
                if(idx === optionIndex) {
                    btn.classList.add(isCorrect ? 'bg-green-50' : 'bg-red-50', isCorrect ? 'border-green-600' : 'border-red-600', isCorrect ? 'text-green-900' : 'text-red-900');
                    btn.querySelector('span:first-child').classList.add(isCorrect ? 'bg-green-600' : 'bg-red-600', 'text-white');
                } else {
                    btn.classList.add('disabled-option');
                }
            });

            fb.innerHTML = qObj.options[optionIndex].feedback;
            fb.classList.remove('hidden');
            fb.classList.add(isCorrect ? 'bg-green-100' : 'bg-red-100', isCorrect ? 'text-green-800' : 'text-red-800', 'border', isCorrect ? 'border-green-400' : 'border-red-400');

            if (isCorrect) {
                // 如果答對，且不是最後一題，1.5秒後顯示下一題
                if (qIndex < stage.questions.length - 1) {
                    setTimeout(() => {
                        const nextQ = document.getElementById(`q-block-${stageIndex}-${qIndex + 1}`);
                        nextQ.classList.remove('hidden');
                        scrollToEl(`q-block-${stageIndex}-${qIndex + 1}`);
                    }, 1200);
                } 
                // 如果是最後一題，顯示總結補充，然後進入下一關或遊戲
                else {
                    setTimeout(() => {
                        document.getElementById(`supplement-${stageIndex}`).classList.remove('hidden');
                        scrollToEl(`supplement-${stageIndex}`);
                        
                        setTimeout(() => {
                            if (stage.postGame) {
                                launchMiniGame(stage.postGame);
                            } else {
                                nextStage();
                            }
                        }, 4500); // 留4.5秒給學生閱讀補充資料
                    }, 1000);
                }
            } else {
                // 答錯，3秒後重置
                setTimeout(() => {
                    fb.classList.add('hidden');
                    fb.className = "hidden mt-4 p-4 rounded-lg font-bold text-lg animate__animated animate__fadeIn";
                    btns.forEach((btn, idx) => { 
                        btn.disabled = false; 
                        btn.className = "btn-option w-full text-left p-4 rounded bg-white border-2 border-gray-400 text-lg font-bold text-gray-800 flex items-start hover:bg-gray-50 transition"; 
                        btn.querySelector('span:first-child').className = `mr-3 mt-1 inline-block bg-gray-200 px-2 py-0.5 rounded text-sm text-gray-800`;
                    });
                }, 3000);
            }
        }

        function nextStage() {
            currentStageIndex++;
            if (currentStageIndex < stages.length) renderStage(currentStageIndex);
            else showAssessment();
        }

        // --- 互動小遊戲區 (嚴格保留) ---

        function checkGame1() {
            const a = document.getElementById('g1-1').value;
            const b = document.getElementById('g1-2').value;
            const c = document.getElementById('g1-3').value;
            const fb = document.getElementById('g1-fb');
            if (a === '冒進' && b === '自力更新' && c === '超英趕美') {
                fb.innerHTML = "✅ 填充正確！完全掌握歷史背景。"; fb.className = "mt-3 font-bold text-green-700 block";
                setTimeout(nextStage, 2000);
            } else {
                fb.innerHTML = "❌ 答案有誤，請再仔細回想剛才推理的過程。"; fb.className = "mt-3 font-bold text-red-600 block";
            }
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
        function drop(ev, cat) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const el = document.getElementById(data);
            if(ev.target.id === `g2-${cat}` || ev.target.parentElement.id === `g2-${cat}`) {
                document.getElementById(`g2-${cat}`).appendChild(el);
            }
        }
        function checkGame2() {
            const ind = Array.from(document.getElementById('g2-industry').children).map(e=>e.id);
            const agr = Array.from(document.getElementById('g2-agriculture').children).map(e=>e.id);
            const fb = document.getElementById('g2-fb');
            if(ind.includes('i1') && ind.includes('i3') && agr.includes('i2') && agr.includes('i4') && ind.length===2 && agr.length===2) {
                fb.innerHTML = "✅ 分類正確！"; fb.className = "mt-3 font-bold text-green-700 block";
                setTimeout(nextStage, 2000);
            } else {
                fb.innerHTML = "❌ 分類有誤，請再試一次。"; fb.className = "mt-3 font-bold text-red-600 block";
            }
        }

        let g3Ans = {1: null, 2: null};
        function ansG3(q, val) {
            g3Ans[q] = val;
            document.getElementById(`g3-${q}-t`).classList.remove('bg-gray-800', 'text-white');
            document.getElementById(`g3-${q}-f`).classList.remove('bg-gray-800', 'text-white');
            document.getElementById(`g3-${q}-${val?'t':'f'}`).classList.add('bg-gray-800', 'text-white');
        }
        function checkGame3() {
            const fb = document.getElementById('g3-fb');
            if(g3Ans[1] === false && g3Ans[2] === true) {
                fb.innerHTML = "✅ 判斷正確！公社是供給制（大鍋飯）而非多勞多得。"; fb.className = "mt-3 font-bold text-green-700 block";
                setTimeout(nextStage, 2000);
            } else {
                fb.innerHTML = "❌ 判斷有誤，請重新思考人民公社的制度缺陷。"; fb.className = "mt-3 font-bold text-red-600 block";
            }
        }

                <div id="final-assessment" class="bg-gray-900 text-white rounded-xl p-8 retro-shadow animate__animated animate__zoomIn border-t-8 border-party-red">
                    <h2 class="text-3xl font-bold text-red-500 mb-6 border-b border-gray-700 pb-4"><i class="fa-solid fa-file-signature"></i> 最終總結評估</h2>
                    <p class="mb-6 text-gray-300 text-lg">同志，經過一連串的政策連鎖推理，我們見證了歷史悲劇的必然。請完成測驗，解鎖您的專屬溫習筆記：</p>
                    <div class="space-y-6">
                        <div class="assessment-q bg-gray-800 p-5 rounded border border-gray-700">
                            <p class="font-bold mb-3 text-lg text-yellow-400">1. 導致「高徵購」並直接引發大饑荒的基層行為是什麼？</p>
                            <select id="aq1" class="w-full text-black p-3 rounded font-medium"><option value="">--請選擇答案--</option><option value="A">A. 農民拒絕繳納公糧</option><option value="B">B. 基層為迎合上級，誇大農產量形成「浮誇風」</option></select>
                        </div>
                        <div class="assessment-q bg-gray-800 p-5 rounded border border-gray-700">
                            <p class="font-bold mb-3 text-lg text-yellow-400">2. 「全民大煉鋼」運動帶來了什麼結果？</p>
                            <select id="aq2" class="w-full text-black p-3 rounded font-medium"><option value="">--請選擇答案--</option><option value="A">A. 煉出大量廢鐵，浪費資源並因抽調人力嚴重荒廢農作</option><option value="B">B. 大幅提升了農業用具的質量與鋼鐵工業基礎</option></select>
                        </div>
                        <div class="assessment-q bg-gray-800 p-5 rounded border border-gray-700">
                            <p class="font-bold mb-3 text-lg text-yellow-400">3. 人民公社的「大鍋飯」造成了什麼負面影響？</p>
                            <select id="aq3" class="w-full text-black p-3 rounded font-medium"><option value="">--請選擇答案--</option><option value="A">A. 提升了全國農村人民的整體營養水平</option><option value="B">B. 取消按勞取酬嚴重挫傷生產積極性，並造成食堂糧食驚人浪費</option></select>
                        </div>
                    </div>
                    <button onclick="checkAssessment()" class="mt-8 w-full py-4 bg-red-700 hover:bg-red-600 font-bold rounded text-xl transition-colors shadow-lg">提交最終評估</button>
                    <p id="assess-fb" class="mt-6 font-bold text-center text-xl hidden"></p>
                </div>
            `;
            container.innerHTML = html;
            scrollToEl('final-assessment');
        }

        function checkAssessment() {
            const q1 = document.getElementById('aq1').value;
            const q2 = document.getElementById('aq2').value;
            const q3 = document.getElementById('aq3').value;
            const fb = document.getElementById('assess-fb');

            if(q1 === 'B' && q2 === 'A' && q3 === 'B') {
                fb.innerHTML = "<i class='fa-solid fa-medal'></i> 滿分通關！您已完全掌握三面紅旗的因果鍊。正在為您生成檔案筆記...";
                fb.className = "mt-6 font-bold text-center text-xl text-green-400 block animate__animated animate__pulse";
                setTimeout(showNotes, 2500);
            } else {
                fb.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> 部分答案錯誤，請回顧剛才的因果推理再試一次。";
                fb.className = "mt-6 font-bold text-center text-xl text-red-400 block animate__animated animate__headShake";
            }
        }

        // --- 全新改版的加強版 PEEL 溫習筆記 ---
        function showNotes() {
            const container = document.getElementById('notes-container');
            const noteContent = `【歷史溫習筆記：三面紅旗運動的因果與教訓】
建國初期一五計畫超額完成（工農業增長達18%），加上中蘇交惡，中共急欲「自力更新」並提出「15年趕超英國」的口號。在此「急功冒進」的政治狂熱下，推行了三面紅旗（總路線、大躍進、人民公社）。

一、工業大躍進 (盲目追求高指標)
• 現象：實施「以鋼為綱」，要求1958年鋼產量翻倍（達1070萬噸）。
• 措施：因缺乏現代設備，發動近9000萬人上陣進行「全民大煉鋼」。把農具、鐵鍋砸碎投入土高爐熔煉。
• 結果：煉出的大部分是毫無工業價值的廢鐵疙瘩（1108萬噸鋼中合格者僅約800萬噸，土法煉鐵全不合格）。不僅耗費巨資、砍伐樹木破壞生態，更因強行抽調大量農村青壯年勞動力，導致農田裡的莊稼無人收割而爛在地裡，直接拖垮了農業基礎。

二、農業大躍進 (違背科學與浮誇造假)
• 現象：推行「以糧為綱」，盲目推廣「深耕密植」與「衛星田」。
• 措施：不顧土壤結構與光照需求，過度密植導致作物惡性競爭枯死，實際畝產大幅下降。然而，為迎合上級、避免被批鬥，基層幹部競相虛報產量，報紙大肆吹噓「畝產萬斤甚至十萬斤」，形成全國性的「浮誇風」。
• 結果：中央根據「假高產」下達了致命的「高徵購」硬任務。為了湊齊徵購額，幹部發動反瞞產私分，動用酷刑將農民活命的口糧、隔年的種子糧與牲畜飼料糧全數搜刮一空，切斷了農民的生路。

三、人民公社 (烏托邦制度摧毀生產力)
• 現象：農村全面推行「一大二公」（規模大、全社公有）。
• 措施：沒收自留地，取消多勞多得的工資制，改為分配平均主義的「大鍋飯」和供給制；設立公共食堂實行「吃飯不要錢」。
• 結果：分配制度的絕對平均，讓社員覺得「幹多幹少一個樣」，徹底摧毀了農民的生產積極性，導致農產量停滯甚至倒退。同時，公共食堂初期放開肚皮吃，管理極度混亂，導致糧食驚人浪費。

四、最終結果 (三年困難時期的人道災難)
• 綜合結論(Point & Link)：
三面紅旗是一場由「政治狂熱凌駕科學」、「浮誇謊言誤導決策」以及「大鍋飯消滅生產力」所共同交織的歷史悲劇。在【農業減產 + 高徵購奪糧 + 公共食堂耗盡庫存】的三重夾擊下，虛假的糧倉迅速見底。農村無糧可食又無種可播，最終直接引發了1959-1961年的「三年困難時期」，造成全國數千萬人非正常死亡的慘痛代價。`;

            const html = `
                <div id="final-notes" class="bg-vintage-paper border-t-8 border-party-red p-8 retro-shadow relative animate__animated animate__fadeInUp">
                    <button onclick="copyNotes()" class="absolute top-6 right-6 bg-gray-800 text-white px-5 py-2 rounded hover:bg-gray-700 transition font-bold shadow"><i class="fa-solid fa-copy mr-2"></i>一鍵輸出筆記</button>
                    <h2 class="text-3xl font-black text-party-red mb-6 border-b-2 border-red-300 pb-3"><i class="fa-solid fa-book-bookmark mr-2"></i>三面紅旗溫習筆記 (PEEL深化版)</h2>
                    <div id="note-text" class="text-gray-900 leading-loose text-lg whitespace-pre-line font-medium">${noteContent}</div>
                </div>
            `;
            container.innerHTML = html;
            scrollToEl('final-notes');
        }

        function copyNotes() {
            const text = document.getElementById('note-text').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("✅ 筆記已成功複製！您可以直接貼上至您的溫習文檔或筆記軟體中。");
            }).catch(err => {
                alert("複製失敗，請手動選取複製。");
            });
        }

        function scrollToEl(id) {
            setTimeout(() => { document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 150);
        }

        window.onload = () => renderStage(currentStageIndex);
    </script>
</body>
</html>
